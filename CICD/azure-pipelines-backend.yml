# ========================================
# CTBC AI Portal Backend - ADO Code Deploy Pipeline
# 觸發: push 到 20* branch → 打包 → ZIP Deploy 到 App Service
# ========================================

trigger:
  branches:
    include:
      - '20*'
  paths:
    include:
      - 'backend/**'
    exclude:
      - 'backend/tests/**'
      - 'README.md'
      - 'docs/**'

pr: none

variables:
  appServiceName: 'YOUR_BACKEND_APP_NAME'
  resourceGroup: 'YOUR_RESOURCE_GROUP'
  azureSubscription: 'YOUR_AZURE_SUBSCRIPTION'
  pythonVersion: '3.10'

stages:
  # ========================================
  # Stage 1: Build - 打包 Backend
  # ========================================
  - stage: Build
    displayName: 'Build Backend'
    pool:
      name: 'SIT_CI_POOL_EAMP'
    jobs:
      - job: PackageBackend
        displayName: 'Package Backend for Deploy'
        steps:
          - checkout: self
            fetchDepth: 1

          - task: UsePythonVersion@0
            displayName: 'Use Python $(pythonVersion)'
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true

          # 設定 UAT 環境變數
          - script: |
              cd backend
              if [ -f ".env.uat" ]; then
                cp .env.uat .env
                echo "Copied .env.uat -> .env"
              fi
            displayName: 'Setup UAT Environment'

          # 清理快取
          - script: |
              cd backend
              find .python_packages -type f \( -name "*.pyc" -o -name "*.pyo" -o -name "*.rst" \) -delete 2>/dev/null || true
              find .python_packages -type d \( -name "__pycache__" -o -name "tests" -o -name "test" -o -name "docs" \) -exec rm -rf {} + 2>/dev/null || true
            displayName: 'Clean Python Cache'

          # 禁用 Oryx Build
          - script: |
              cd backend
              echo '[config]' > .deployment
              echo 'SCM_DO_BUILD_DURING_DEPLOYMENT = false' >> .deployment
            displayName: 'Disable Oryx Build'

          # 打包
          - script: |
              cd backend
              zip -r $(Build.ArtifactStagingDirectory)/backend.zip . \
                -x "__pycache__/*" "*.pyc" "*.pyo" \
                   "tests/*" ".git/*" ".pytest_cache/*" \
                   "*.egg-info/*" "*.log" \
                   ".venv/*" "venv/*"
            displayName: 'Package Backend ZIP'

          # 驗證
          - script: |
              python3 << 'PY'
              import zipfile
              with zipfile.ZipFile("$(Build.ArtifactStagingDirectory)/backend.zip") as zf:
                  files = [n for n in zf.namelist() if not n.endswith("/")]
                  for req in ["startup.sh", "main.py", "config.py"]:
                      assert req in files, f"ERROR: missing {req}"
              print("backend.zip validated OK")
              PY
            displayName: 'Validate ZIP'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'backend-drop'
              publishLocation: 'Container'

  # ========================================
  # Stage 2: Deploy - ZIP Deploy 到 App Service
  # ========================================
  - stage: Deploy
    displayName: 'Deploy to UAT'
    dependsOn: Build
    condition: succeeded()
    pool:
      name: 'SIT_CD_POOL_LINUX'
    jobs:
      - deployment: DeployBackend
        displayName: 'Deploy Backend to App Service'
        environment: 'UAT'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'ZIP Deploy to App Service'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: 'webAppLinux'
                    appName: '$(appServiceName)'
                    package: '$(Pipeline.Workspace)/backend-drop/backend.zip'
                    startUpCommand: 'bash startup.sh'

                - task: AzureAppServiceManage@0
                  displayName: 'Restart App Service'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    Action: 'Restart Azure App Service'
                    WebAppName: '$(appServiceName)'
                  continueOnError: true
