# ========================================
# CTBC AI Portal Frontend - Build + Deploy (UAT)
# Push to local-dev → npm build → pm2 serve on portalpilotfe
# ========================================
# 必要 GitHub Secrets:
#   AZURE_FE_PUBLISH_PROFILE - Frontend App Service Publish Profile
# ========================================

name: 'Frontend Deploy (UAT)'

on:
  push:
    branches: [local-dev]
    paths:
      - 'azure-portal/**'

  workflow_dispatch:

env:
  APP_NAME: portalpilotfe
  VITE_API_BASE_URL: https://portalpilotbe-a4evd7cqcahvbnbv.japanwest-01.azurewebsites.net

jobs:
  build-and-deploy:
    name: 'Build 前端 + 部署'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: azure-portal/package-lock.json

      - name: 'Install & Build Frontend'
        working-directory: azure-portal
        run: |
          npm ci
          VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }} npm run build
          echo "Frontend build 完成"

      - name: '準備部署包'
        run: |
          # vite build 輸出到 backend/static/，複製到 deploy 目錄
          mkdir -p deploy
          cp -r backend/static/* deploy/
          # 驗證
          test -f deploy/index.html || { echo "ERROR: index.html not found"; exit 1; }
          echo "部署包準備完成"
          ls -la deploy/

      - name: '打包'
        run: |
          cd deploy
          zip -r "${{ github.workspace }}/frontend.zip" .

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FE_PUBLISH_PROFILE }}
          package: frontend.zip
